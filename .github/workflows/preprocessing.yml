name: Data Preprocessing Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'dataset_raw/winequality-red.csv'
      - 'preprocessing/automate_Naufal_Aji_Ferdiansyah.py'

concurrency:
  group: preprocessing-pipeline
  cancel-in-progress: true

jobs:
  run-preprocessing:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run Automate Script
        run: |
          python preprocessing/automate_Naufal_Aji_Ferdiansyah.py

      - name: Commit and Push Processed Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f "preprocessing/winequality_preprocessing.csv" ]; then
            git add preprocessing/winequality_preprocessing.csv
          fi

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit."
            exit 0
          fi

          git commit -m "Auto-update processed dataset"

          git pull --rebase origin main

          git push origin main