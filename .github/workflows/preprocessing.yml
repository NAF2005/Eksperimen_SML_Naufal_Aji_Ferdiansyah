name: Data Preprocessing Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'dataset_raw/winequality-red.csv'
      - 'preprocessing/automate_Naufal_Aji_Ferdiansyah.py'
      
jobs:
  run-preprocessing:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas scikit-learn
        
    - name: Run Automate Script
      run: |
        python preprocessing/automate_Naufal_Aji_Ferdiansyah.py
        
    - name: Commit and Push Processed Data
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # 1. Tambahkan file hasil preprocessing
        if [ -f "preprocessing/winequality_preprocessing.csv" ]; then
          git add preprocessing/winequality_preprocessing.csv
        fi
        
        # 2. PENTING: Ambil perubahan terbaru di GitHub sebelum push
        git pull --rebase origin main
        
        # 3. Commit dan push hanya jika ada perubahan
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update processed dataset" && git push origin main)